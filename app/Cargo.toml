[package]
name = "pw-dump-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Standalone live PipeWire graph viewer (runs pw-dump -m and serves the viewer)"

[[bin]]
name = "pw-dump-graph"
path = "src/main.rs"

# Released by `dist`. Build with the frontend embedded so the binary is
# self-contained (the release CI runs `npm run build` first — see
# .github/workflows/build-setup.yml).
[package.metadata.dist]
features = ["embed"]

[features]
default = []
# Bake the built frontend into the binary (via common) for a single distributable.
embed = ["pw-dump-graph-common/embed"]

[dependencies]
pw-dump-graph-common = { path = "../common" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde_json = "1"
async-stream = "0.3"
