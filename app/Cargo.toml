[package]
name = "pw-dump-graph"
version = "0.1.0"
edition = "2021"
description = "Standalone live PipeWire graph viewer (runs pw-dump -m and serves the viewer)"

[[bin]]
name = "pw-dump-graph"
path = "src/main.rs"

[features]
default = []
# Bake the built frontend into the binary (via common) for a single distributable.
embed = ["pw-dump-graph-common/embed"]

[dependencies]
pw-dump-graph-common = { path = "../common" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde_json = "1"
async-stream = "0.3"
