<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pw-dump-graph</title>
  </head>
  <body>
    <header id="toolbar">
      <span class="title">pw-dump-graph</span>
      <label class="file-btn">
        Open file…
        <input id="file-input" type="file" accept=".json,application/json" hidden />
      </label>
      <button id="paste-btn" type="button">Paste JSON…</button>
      <button id="share-btn" type="button" disabled>Share…</button>
      <span id="status" class="status"></span>
    </header>

    <main id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="dropzone-hint"><span>Drop a <code>pw-dump.json</code> here</span></div>
      <aside id="details" hidden></aside>
      <aside id="legend">
        <span class="legend-item"><i class="swatch"></i>Port</span>
        <span class="legend-item"><i class="swatch monitor"></i>Monitor</span>
        <span class="legend-item"><i class="swatch inactive"></i>Unconnected</span>
        <span class="legend-item"><i class="swatch link"></i>Inactive link</span>
        <span class="legend-item"><i class="glyph">⧉</i>Filter graph</span>
      </aside>
    </main>

    <dialog id="paste-dialog">
      <form method="dialog">
        <h3>Paste pw-dump JSON</h3>
        <textarea id="paste-area" rows="16" placeholder="pw-dump  |  (paste the JSON array here)"></textarea>
        <menu>
          <button value="cancel">Cancel</button>
          <button id="paste-load" value="load" type="button">Render</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/frontend/main.ts"></script>
  </body>
</html>
