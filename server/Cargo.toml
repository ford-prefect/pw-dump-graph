[package]
name = "pw-dump-graph-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "In-memory keyed share service for pw-dump-graph"

# Not part of the binary release (app-only for now).
[package.metadata.dist]
dist = false

[features]
default = []
# Bake the built frontend into the binary (via the common crate) for one
# self-contained artifact; without it, common serves the frontend from PWG_DIST.
embed = ["pw-dump-graph-common/embed"]

[dependencies]
pw-dump-graph-common = { path = "../common" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
rand = "0.8"
flate2 = "1"
