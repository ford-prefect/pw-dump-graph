[package]
name = "pw-dump-graph-server"
version = "0.1.0"
edition = "2021"
description = "In-memory keyed share service for pw-dump-graph"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
rand = "0.8"

[profile.release]
strip = true
