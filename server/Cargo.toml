[package]
name = "pw-dump-graph-server"
version = "0.1.0"
edition = "2021"
description = "In-memory keyed share service for pw-dump-graph"

[features]
default = []
# Bake the built frontend into the binary for one self-contained artifact
# (requires `npm run build` first). Without it the server still serves the
# frontend from PWG_DIST on disk when present, so `just serve` works in dev.
embed = ["dep:rust-embed"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde_json = "1"
rand = "0.8"
mime_guess = "2"
rust-embed = { version = "8", optional = true }

[profile.release]
strip = true
