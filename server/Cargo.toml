[package]
name = "pw-dump-graph-server"
version = "0.1.0"
edition = "2021"
description = "In-memory keyed share service for pw-dump-graph"

[features]
default = []
# Bake the built frontend (../dist) into the binary for one self-contained
# artifact. Requires `npm run build` first. Without it the server serves only the
# API and you use the Vite dev server (which proxies /api here) for the frontend.
embed = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
rand = "0.8"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[profile.release]
strip = true
